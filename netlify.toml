# Netlify deployment. The Next.js app is built by Netlify's built-in OpenNext adapter (no plugin entry needed).
#
# The outreach pipeline runs in a Netlify BACKGROUND FUNCTION (15-minute limit, source: netlify/background-src/outreach-background.ts, bundled by
# scripts/build-background.mjs into netlify/functions/outreach-background.mjs). Ordinary functions and Netlify scheduled functions stop at about
# 30 s, but one outreach cycle needs up to 55 s. cron-job.org keeps calling GET /api/cron/outreach (Bearer secret); that route only
# authenticates and hands over to the background function.
[build]
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

[functions."outreach-background"]
  background = true
